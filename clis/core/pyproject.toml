[project]
name = "cellstudio-cli-core"
version = "0.1.0"
description = "Shared CLI skeleton, config and IO helpers for CellStudio tool CLIs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tifffile>=2024.8.30",
    "typer>=0.12",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cli_core"
