[project]
name = "cellstudio-cli"
version = "0.1.0"
description = "CellStudio umbrella CLI: discovers tool CLIs and dispatches runs into their own environments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
cellstudio = "cellstudio_cli.app:main"

[build-system]
requires = ["uv_build>=0.7.19,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cellstudio_cli"
