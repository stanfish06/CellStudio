[project]
name = "tracker"
version = "0.1.0"
description = "Cell tracking on segmentation masks (laptrack, ultrack)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cellstudio-cli-core",
    "laptrack>=0.17.1",
    "ultrack>=0.8.0",
]

[project.scripts]
tracker = "tracker.cli:main"

# torch is a transitive dep (ultrack); default install gets the cpu build,
# gpu-cuXXX groups get the matching cuda build (dispatched by cellstudio)
[dependency-groups]
cpu = ["torch>=2.13"]
gpu-cu126 = ["torch>=2.13 ; sys_platform == 'linux' and platform_machine == 'x86_64'"]
gpu-cu130 = ["torch>=2.13 ; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv]
# cuda index pins cannot resolve for darwin splits; these envs run on linux x86_64
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["cpu"]
conflicts = [
    [
        { group = "cpu" },
        { group = "gpu-cu126" },
        { group = "gpu-cu130" },
    ],
]

[tool.uv.sources]
cellstudio-cli-core = { path = "../core", editable = true }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "gpu-cu126" },
    { index = "pytorch-cu130", group = "gpu-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.7.19,<0.9.0"]
build-backend = "uv_build"
