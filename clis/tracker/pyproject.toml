[project]
name = "tracker"
version = "0.1.0"
description = "Cell tracking on segmentation masks (laptrack, ultrack)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cellstudio-cli-core",
    "laptrack>=0.17.1",
    "ultrack>=0.8.0",
]

[project.scripts]
tracker = "tracker.cli:main"

# torch is a transitive dep (ultrack); default install gets the cpu build,
# `uv sync --no-default-groups --group gpu` gets cuda for cloud GPU machines
[dependency-groups]
cpu = ["torch>=2.13"]
gpu = ["torch>=2.13"]

[tool.uv]
default-groups = ["cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
cellstudio-cli-core = { path = "../core", editable = true }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.7.19,<0.9.0"]
build-backend = "uv_build"
