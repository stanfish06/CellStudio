[project]
name = "segmenter"
version = "0.1.0"
description = "Automatic cell segmentation (cellpose, stardist, micro-sam)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cellpose>=4.2.1.1",
    "dinov3",
    "cellstudio-cli-core",
    "micro-sam>=1.8.10",
    "stardist>=0.9.2",
    # stardist imports tensorflow at runtime but does not declare it
    "tensorflow>=2.20",
]

[project.scripts]
segmenter = "segmenter.cli:main"

# torch/torchvision are transitive deps (cellpose, micro-sam); default install gets
# cpu builds, `uv sync --no-default-groups --group gpu` gets cuda for cloud GPU machines
[dependency-groups]
cpu = [
    "torch>=2.13",
    "torchvision>=0.28",
]
gpu-cu126 = [
    "torch>=2.13 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision>=0.28 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # tensorflow's cuda libs come from pip; without this TF silently runs on CPU
    "tensorflow[and-cuda]>=2.20 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
gpu-cu130 = [
    "torch>=2.13 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision>=0.28 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # tensorflow's cuda libs come from pip; without this TF silently runs on CPU
    "tensorflow[and-cuda]>=2.20 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Bio-Formats reader for vsi/ims/oir etc: uv sync --group bioformats (needs a Java runtime)
bioformats = ["cellstudio-cli-core[bioformats]"]

[tool.uv]
# cuda index pins cannot resolve for darwin splits; these envs run on linux x86_64
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["cpu"]
conflicts = [
    [
        { group = "cpu" },
        { group = "gpu-cu126" },
        { group = "gpu-cu130" },
    ],
]
# micro-sam hard-depends on pyqt6 for its napari annotator GUI; this CLI is headless
exclude-dependencies = ["pyqt6"]

[tool.uv.sources]
cellstudio-cli-core = { path = "../core", editable = true }
dinov3 = { git = "https://github.com/facebookresearch/dinov3" }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "gpu-cu126" },
    { index = "pytorch-cu130", group = "gpu-cu130" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "gpu-cu126" },
    { index = "pytorch-cu130", group = "gpu-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.7.19,<0.9.0"]
build-backend = "uv_build"
