[project]
name = "segmenter"
version = "0.1.0"
description = "Automatic cell segmentation (cellpose, stardist, micro-sam)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cellpose>=4.2.1.1",
    "cellstudio-cli-core",
    "micro-sam>=1.8.10",
    "stardist>=0.9.2",
    # stardist imports tensorflow at runtime but does not declare it
    "tensorflow>=2.20",
]

[project.scripts]
segmenter = "segmenter.cli:main"

# torch/torchvision are transitive deps (cellpose, micro-sam); default install gets
# cpu builds, `uv sync --no-default-groups --group gpu` gets cuda for cloud GPU machines
[dependency-groups]
cpu = [
    "torch>=2.13",
    "torchvision>=0.28",
]
gpu = [
    "torch>=2.13",
    "torchvision>=0.28",
]

[tool.uv]
default-groups = ["cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
cellstudio-cli-core = { path = "../core", editable = true }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.7.19,<0.9.0"]
build-backend = "uv_build"
