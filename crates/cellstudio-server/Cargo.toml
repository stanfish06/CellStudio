[package]
name = "cellstudio-server"
version.workspace = true
edition.workspace = true

[lib]
name = "cellstudio_server"
path = "src/lib.rs"

[[bin]]
name = "cellstudio-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
cellstudio-core = { workspace = true }
cellstudio-db = { workspace = true }
flate2 = "1.1.9"
futures = "0.3.34"
parking_lot = "0.12.5"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
